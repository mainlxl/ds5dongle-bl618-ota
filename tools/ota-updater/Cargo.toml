[package]
name = "ds5dongle-ota-updater"
version = "0.1.0"
edition = "2021"
description = "Cross-platform desktop OTA updater for DS5Dongle BL618"
license = "MIT"

[dependencies]
anyhow = "1.0"
eframe = { version = "0.28", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
hex = "0.4"
hidapi = { version = "2.6", features = ["macos-shared-device"] }
image = { version = "=0.25.8", default-features = false }
reqwest = { version = "=0.11.27", default-features = false, features = ["blocking", "rustls-tls"] }
sha2 = "0.10"
url = "=2.4.1"
